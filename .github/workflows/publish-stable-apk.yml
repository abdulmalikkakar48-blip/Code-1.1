name: Publier l'APK Selkie à signature fixe
on:
  push:
    branches: [maree-apk-download]
    paths:
      - '.github/workflows/publish-stable-apk.yml'
      - 'tools/publish_stable_apk.py'
      - 'tools/sign_apk.py'
      - 'tools/selkie-signed-public.json'
  workflow_dispatch:

concurrency:
  group: selkie-stable-download
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/maree-apk-download'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Installer le vérificateur Android officiel
        run: sdkmanager "build-tools;34.0.0"
      - name: Préparer l'APK signé et ses sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_stable_apk.py
      - name: Vérifier la signature fixe
        run: python tools/sign_apk.py downloads/Selkie-Android.apk --verify-only
      - name: Mettre à jour le lien de téléchargement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/Selkie-Android.apk downloads/Selkie-Android-source.zip downloads/Selkie-Android.sha256
          if git diff --cached --quiet; then
            echo "Téléchargement déjà à jour."
            exit 0
          fi
          git commit -m "Publish redesigned Selkie APK with backed-up stable signature"
          git push origin HEAD:maree-apk-download
      - uses: actions/upload-artifact@v4
        with:
          name: Selkie-Android-stable-APK
          path: |
            downloads/Selkie-Android.apk
            downloads/Selkie-Android.sha256
            downloads/VALIDATION.md
          if-no-files-found: error
