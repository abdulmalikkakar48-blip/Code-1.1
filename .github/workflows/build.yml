name: Construire l'APK Android
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
      - name: Installer Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Préparer le cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Construire et vérifier l'APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Milo-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
