name: Construire l'APK Android
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [maree-apk-download]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Installer Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Préparer le cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Construire et vérifier l'APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Fournir la compilation intermédiaire à signer
        uses: actions/upload-artifact@v4
        with:
          name: Selkie-build-to-sign
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Expliquer la signature de distribution
        run: |
          echo "Cet artefact utilise la clé debug temporaire du runner. Signer avec la clé fixe sauvegardée avant distribution ; voir docs/SIGNATURE_ANDROID.md." >> "$GITHUB_STEP_SUMMARY"
