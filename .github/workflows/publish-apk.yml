name: Mettre à jour l'APK téléchargeable
on:
  push:
    branches: [maree-apk-download]
    paths:
      - '.github/workflows/publish-apk.yml'
      - 'tools/publish_test_apk.py'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Récupérer le projet et son historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publier l'APK déjà testé et les sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/publish_test_apk.py
      - name: Enregistrer les téléchargements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/Selkie-Android.apk downloads/Selkie-Android-avant-refonte.apk downloads/Selkie-Android-source.zip downloads/INSTALLATION.md downloads/VALIDATION.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish tested Selkie redesign APK and matching sources"
            git push origin HEAD:maree-apk-download
          fi
